apiVersion: v1
kind: Service
metadata:
  name: email
  labels:
    name: email
spec:
  ports:
    - port: 2525
      targetPort: email-smtp
  selector:
    name: email

---

apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: email
spec:
  replicas: 1
  template:
    metadata:
      labels:
        name: email
    spec:
      containers:
        - name: email
          image: boky/postfix
          ports:
            - name: email-smtp
              containerPort: 587
          env:
            - name: ALLOWED_SENDER_DOMAINS
              value: chuspace.com
            - name: RELAYHOST
              value: '[smtp.sendgrid.net]:2525'
            - name: RELAY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: email
                  key: username
            - name: RELAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: email
                  key: password
