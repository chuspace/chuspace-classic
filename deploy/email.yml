apiVersion: v1
kind: Service
metadata:
  name: email
  labels:
    name: email
spec:
  ports:
    - port: 25
      targetPort: email-smtp
  selector:
    name: email

---

apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: email
spec:
  replicas: 1
  template:
    metadata:
      labels:
        name: email
    spec:
      containers:
        - name: email
          image: boky/postfix
          ports:
            - name: email-smtp
              containerPort: 587
