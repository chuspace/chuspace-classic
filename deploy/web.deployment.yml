apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: chuspace-web
spec:
  replicas: 1
  template:
    metadata:
      labels:
        name: chuspace-web
    spec:
      initContainers:
        - name: db-migrate
          image: grc.io/chuspace-210609/chuspace-web:latest
          command:
            - bin/rails
            - db:migrate
          env:
            - name: RAILS_ENV
              value: production

      containers:
        - name: chuspace-web
          image: grc.io/chuspace-210609/chuspace-web:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: FORMATION
              value: web=1
            - name: RAILS_SERVE_STATIC_FILES
              value: 'true'
            - name: RAILS_ENV
              value: production
            - name: NODE_ENV
              value: production
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chuspace
                  key: redis_url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: chuspace
                  key: secret_key_base
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chuspace
                  key: database_url
          ports:
            - name: http-server
              containerPort: 3000
