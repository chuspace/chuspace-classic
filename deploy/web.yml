apiVersion: v1
kind: Service
metadata:
  name: chuspace-web
  labels:
    name: chuspace-web
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: http-server
  selector:
    name: chuspace-web

---
    
apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: chuspace-web
spec:
  replicas: 1
  template:
    metadata:
      labels:
        name: chuspace-web
    spec:
      initContainers:
        - name: db-migrate
          image: gcr.io/chuspace-210609/chuspace-web:latest
          command: ['bin/rails', 'db:migrate']
          env:
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: redis:6379
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: secret_key_base
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_password
      containers:
        - name: chuspace-web
          image: gcr.io/chuspace-210609/chuspace-web:latest
          env:
            - name: FORMATION
              value: web=1
            - name: RAILS_SERVE_STATIC_FILES
              value: 'true'
            - name: RAILS_ENV
              value: production
            - name: NODE_ENV
              value: production
            - name: REDIS_URL
              value: redis:6379
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: secret_key_base
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_password
          ports:
            - name: http-server
              containerPort: 3000

---

apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: chuspace-worker
  labels:
    name: chuspace-worker
spec:
  replicas: 1
  template:
    metadata:
      labels:
        name: chuspace-worker
    spec:
      containers:
        - name: chuspace-worker
          image: gcr.io/chuspace-210609/chuspace-web:latest
          env:
            - name: FORMATION
              value: worker=1
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: redis:6379
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: secret_key_base
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_password
