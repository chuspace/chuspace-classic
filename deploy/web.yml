apiVersion: v1
kind: Service
metadata:
  name: chuspace-web
  labels:
    name: chuspace-web
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: web-server
      protocol: TCP
  selector:
    name: chuspace-web

---

apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: chuspace-web
spec:
  replicas: 1
  template:
    metadata:
      labels:
        name: chuspace-web
    spec:
      initContainers:
        - name: db-migrate
          image: gcr.io/chuspace-210609/chuspace-web
          command: ['bin/rails']
          args: ['db:migrate']
          imagePullPolicy: Always
          env:
            - name: RAILS_ENV
              value: staging
            - name: RAILS_LOG_TO_STDOUT
              value: 'true'
            - name: REDIS_URL
              value: redis://$(REDIS_SERVICE_HOST):$(REDIS_SERVICE_PORT)
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: secret_key_base
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_password
            - name: STORAGE_KEYFILE
              value: /secrets/cloud-storage/credentials.json
          volumeMounts:
            - name: cloud-storage-credentials
              mountPath: /secrets/cloud-storage
      containers:
        - name: chuspace-web
          image: gcr.io/chuspace-210609/chuspace-web:latest
          env:
            - name: FORMATION
              value: web=1
            - name: PORT
              value: '3000'
            - name: RAILS_SERVE_STATIC_FILES
              value: 'true'
            - name: RAILS_LOG_TO_STDOUT
              value: 'true'
            - name: RAILS_ENV
              value: staging
            - name: NODE_ENV
              value: staging
            - name: REDIS_URL
              value: redis://$(REDIS_SERVICE_HOST):$(REDIS_SERVICE_PORT)
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: secret_key_base
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_password
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github
                  key: client_id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github
                  key: client_secret
            - name: STORAGE_KEYFILE
              value: /secrets/cloud-storage/credentials.json
          ports:
            - name: web-server
              containerPort: 3000
          volumeMounts:
            - name: cloud-storage-credentials
              mountPath: /secrets/cloud-storage
      volumes:
        - name: cloud-storage-credentials
          secret:
            secretName: cloud-storage-credentials

---

apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: chuspace-worker
  labels:
    name: chuspace-worker
spec:
  replicas: 1
  template:
    metadata:
      labels:
        name: chuspace-worker
    spec:
      containers:
        - name: chuspace-worker
          image: gcr.io/chuspace-210609/chuspace-web:latest
          env:
            - name: FORMATION
              value: worker=1
            - name: RAILS_ENV
              value: staging
            - name: RAILS_LOG_TO_STDOUT
              value: 'true'
            - name: REDIS_URL
              value: redis://$(REDIS_SERVICE_HOST):$(REDIS_SERVICE_PORT)
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: secret_key_base
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chuspace-web
                  key: db_password
            - name: STORAGE_KEYFILE
              value: /secrets/cloud-storage/credentials.json
          volumeMounts:
            - name: cloud-storage-credentials
              mountPath: /secrets/cloud-storage
      volumes:
        - name: cloud-storage-credentials
          secret:
            secretName: cloud-storage-credentials
