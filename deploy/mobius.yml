apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ssd
provisioner: kubernetes.io/gce-pd
parameters:
  type: pd-ssd

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mobius
spec:
  volumeMode: Filesystem
  storageClassName: ssd
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
  resources:
    requests:
      storage: 30Gi

---

apiVersion: v1
kind: Service
metadata:
  name: mobius
  labels:
    name: mobius
spec:
  ports:
    - port: 1006
      targetPort: mobius-http
      protocol: TCP
  selector:
    name: mobius

---

apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: mobius
  labels:
    name: mobius
spec:
  replicas: 1
  selector:
    matchLabels:
      name: mobius
  template:
    metadata:
      name: mobius
      labels:
        name: mobius
    spec:
      containers:
        - name: mobius
          image: gcr.io/chuspace-210609/mobius
          imagePullPolicy: IfNotPresent
          env:
            - name: GIT_STORAGE_PATH
              value: /mnt/git
            - name: PORT
              value: "1006"
          ports:
            - name: mobius-http
              containerPort: 1006
          volumeMounts:
            - name: git-storage
              mountPath: /mnt/git
      volumes:
        - name: git-storage
          persistentVolumeClaim:
            claimName: mobius
