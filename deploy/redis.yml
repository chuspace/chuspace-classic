apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  template:
    metadata:
      labels:
        name: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis-server
              containerPort: 6739
      restartPolicy: Always

---

apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    name: redis
spec:
  type: LoadBalancer
  ports:
    - port: 6739
      targetPort: redis-server
  selector:
    name: redis
      

