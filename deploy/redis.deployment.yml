apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: redis
  labels:
    app: chuspace
    tier: backend
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: chuspace
        tier: backend
    spec:
      containers:
        - name: redis
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chuspace
                  key: redis_url
          ports:
            - name: redis-server
              containerPort: 6739
