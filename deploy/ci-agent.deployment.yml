apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: chuspace-ci-agent
spec:
  replicas: 1
  template:
    metadata:
      labels:
        name: chuspace-ci-agent
    spec:
      containers:
        - name: ci-agent
          image: drone/agent:0.8
          imagePullPolicy: Always
          env:
            - name: DRONE_SERVER
              value: chuspace-ci.default.svc.cluster.local:9000
            - name: DRONE_SECRET
              valueFrom:
                secretKeyRef:
                  name: drone
                  key: secret
          volumeMounts:
            - mountPath: /var/run/docker.sock
              name: docker-socket
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
