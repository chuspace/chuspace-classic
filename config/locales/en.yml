---
en:
  activemodel:
    errors:
      models:
        blob:
          attributes:
            content:
              invalid_content_type: is invalid. Supported types are text and images.
              invalid_size: is invalid. Allowed blob size is %{size}MB for %{type}.
            name:
              invalid_extname: is invalid. Supported types are 'md', 'gif', 'png'
                and 'jpg'.
  activerecord:
    errors:
      models:
        key:
          attributes:
            key:
              invalid_key: is invalid. It must begin with 'ssh-ed25519', 'ssh-rsa',
                'ssh-dss', 'ecdsa-sha2-nistp256', 'ecdsa-sha2-nistp384', or 'ecdsa-sha2-nistp521'.
                Please paste public key only.
              nonunique_key: is already taken
        post:
          attributes:
            slug:
              invalid: should be all lowercase, unique, min 10 character, may have
                a single hyphen and no special characters.
            topics:
              too_long: maximum %{count} topics allowed
        publication:
          attributes:
            personal:
              invalid: is invalid. It must begin set to either 'nil' or 'true'
            website:
              invalid: should be a valid web url
            twitter:
              invalid: 'should be a valid twitter url. ex: https://twitter.com/chuspace_com'
        user:
          attributes:
            avatar:
              invalid_size: is invalid. Please upload images size up to 5 MB.
              invalid_type: is invalid. Please upload 'gif', 'png', 'jpg' images only.
            email:
              blank: can't be blank. should be a valid email
              invalid: should be a valid email
            name:
              blank: can't be blank. should be your full name
            nickname:
              blank: can't be blank. should be all lowercase, unique, min 1 character,
                may have a single hyphen but cannot begin or end with a hyphen.
              invalid: should be all lowercase, unique, min 1 character, may have
                a single hyphen but cannot begin or end with a hyphen.
            publication:
              invalid: should have a default publication.
            url:
              invalid: should be a valid url
            location:
              invalid: should be a valid name, no special characters
  chuspace:
    pitch: |
      Chuspace is a collaborative blogging platform for developers like Github,
      where articles can be shared and maintained just like code.
  frontpage:
    no_posts: No posts published yet.
  header:
    guest:
      signin_cta: Got an account?
  invitations:
    accept:
      success: You've successfully joined %{publication} publication as %{role}.
    create:
      success: You've invited %{identifier} to join %{publication} publication! They'll
        be receiving an email shortly.
  layouts:
    mailer:
      do_not_share: This email contains unique secure links that allow you to access
        Chuspace. Please do not forward or share this email.
  magic_login:
    expired: Login link expired! Please request a new one.
  pages:
    index:
      heading: Blogging platform for developers
      intro: Chuspace is a blogging platform built on Git. Publish, learn and collaborate
        using the tools you love and use everyday.
  policy:
    default: You cannot perform this action.
    post_policy:
      create?: You cannot create posts!
      show?: You cannot view this post!
      update?: You cannot edit this post!
  publications:
    edit:
      heading: Publication profile
      intro: Update publication profile
    form:
      avatar_hint: Drop images here or click to browse. Maximum image size 5MB
    index:
      heading: Publications
      intro: Create or follow other publications
    new:
      heading: Create a publication
      intro: Publication helps your organise posts
    no_posts: This publication does not have any posts yet.
    none: You don't have any publications
    people:
      destroy:
        success: Removed successfully!
      update:
        success: Role successfully updated!
  settings:
    keys:
      create:
        success: Ssh key successfully added to your account
      destroy:
        success: Ssh key successfully removed from your account
    profiles:
      form:
        avatar_hint: Drop images here or click to browse. Maximum image size 5MB
  signins:
    create:
      blank: can't be blank
      failure: We couldn't find that email. Perhaps you mispelled it?
      success: We have sent you an email with a login link
    index:
      heading: Sign in
      intro: Enter the email address associated with your account, and we’ll send
        a magic link to your inbox.
    tokens:
      create:
        invalid: Login token invalid or expired
      index:
        heading: Sign in
        intro: Enter the login token from your email
  signups:
    index:
      heading: Join Chuspace
      intro: Blogging platform for developers
  user_drafts:
    no_posts: This author does not have any posts yet.
  user_mailer:
    invite:
      subject: '@%{sender} has invited you to join the @%{publication} publication'
    send_magic_login:
      body: Click on the button below to sign in to your Chuspace account. This magic
        link will expire in %{expires_in} minutes and can only be used once.
      compliance: If you did not make this request, you can safely ignore this email.
      direct_url: If the button above doesn’t work, paste this link into your web
        browser
      salutation: Hey %{name},
      subject: Log in to Chuspace, %{name}
      token: If you can't use the magic login link, for example when using our PWA
        app, please %{link} and enter the token below
    welcome:
      body: Thank you for signing up! Chuspace is currently in alpha and we're really
        happy to have you onboard. Please give it a try and help us make it better.
      outro: Hope you will have a good experience. Just send us an email if you have
        any questions.
      salutation: Hey %{name},
      subject: Welcome to Chuspace, %{name}
  users:
    create:
      success: Welcome aboard! we have sent you an email with login link.
    no_posts: This author does not have any posts yet.
    no_posts_btn_text: Publish one
