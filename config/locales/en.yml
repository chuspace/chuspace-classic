en:
  activerecord:
    errors:
      models:
        user:
          attributes:
            nickname:
              invalid: may only contain alphanumeric characters or single hyphens, and cannot begin or end with a hyphen
        ssh_key:
          attributes:
            key:
              invalid_key: is invalid. It must begin with 'ssh-ed25519', 'ssh-rsa', 'ssh-dss', 'ecdsa-sha2-nistp256', 'ecdsa-sha2-nistp384', or 'ecdsa-sha2-nistp521'. Please paste public key only.
              nonunique_key: is already taken

  login_mailer:
    send_magic_login:
      subject: Log in to Chuspace
      link_request: You don’t need a password to access your Chuspace account. Just click the secure link below.
      heading: Log in to Chuspace

  invite_mailer:
    notify_invitee:
      subject: Thanks for registering
      body: We will let you know once we are ready
      heading: Thanks for registering your interest

    send_rsvp:
      subject: Welcome to Chuspace
      body: Please use this link to signup
      heading: Click to signup

  ssh_key:
    create:
      success: Ssh key successfully added to your account
    destroy:
      success: Ssh key successfully removed from your account

  invite:
    attributes:
      email:
        help_text: We’ll never share your email address with anyone.

    create:
      success: We have received your invite request.

  signup:
    code_invalid: Your signup code is invalid. Please use the code sent in your email to signup.
    code_accepted: Looks like you have already joined. Please login
    success: Welcome aboard! we have sent you an email with login link.

    attributes:
      name:
        help_text: Your full name

      email:
        help_text: We’ll never share your email address with anyone.

      nickname:
        help_text: Should be lowercase, alphanumeric characters or single hyphens

  login:
    email_not_found: We couldn't find that email. Perhaps you mispelled it?
    success: We have sent you an email with login link.

  magic_login:
    expired: Login link expired! Please request a new one.

  check_nickname:
    taken: Oops! %{nickname} is already taken.

  check_email:
    taken: Oops! %{email} is already taken.
