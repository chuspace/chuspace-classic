
server_tokens off;
more_set_headers "Server: Chuspace.com";

upstream anycable {
  server 127.0.0.1:8081;
}

upstream imgproxy {
  server 127.0.0.1:8082;
}

upstream puma {
  server 127.0.0.1:8083;
}

server {
  server_name www.chuspace.com;
  return 301 https://chuspace.com$request_uri;
}

server {
  server_name chuspace.com;
  root /home/git/chuspace.com/current/public;

  listen 80;
  listen [::]:443 ssl http2;
  listen 443 ssl http2;
  gzip off;

  ssl_certificate /etc/letsencrypt/live/chuspace.com-0001/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chuspace.com-0001/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/chuspace.com-0001/chain.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  try_files $uri/index.html $uri @puma;

  location ~* /(packs|assets)/ {
    gzip_static on;
    expires 31536000;
    add_header Cache-Control public;
  }

  location @puma {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_pass http://puma;
  }

  error_page 500 502 503 504 /500.html;
  client_max_body_size 25M;
  keepalive_timeout 10;
}

server {
  server_name images.chuspace.com;
  listen [::]:443 ssl http2;
  listen 443 ssl http2;
  gzip off;

  location / {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_redirect off;
    proxy_pass http://imgproxy;
  }

  client_max_body_size 25M;
  keepalive_timeout 10;
}

server {
  server_name live.chuspace.com;
  listen [::]:443 ssl http2;
  listen 443 ssl http2;
  gzip off;

  add_header X-Request-ID $request_id;

  location / {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://anycable;
  }

  client_max_body_size 5M;
}
