upstream imgproxy {
  server 172.26.9.97:80;
}

upstream anycable {
  server 172.26.9.168:80;
}

upstream puma {
  server 0.0.0.0:3000;
}

server {
  server_name www.chuspace.com;
  return 301 https://chuspace.com$request_uri;
}

server {
  server_name chuspace.com;
  root /home/chuspace/chuspace.com/current/public;

  listen [::]:443 ssl http2;
  listen 443 ssl http2;
  gzip off;

  ssl_certificate /etc/letsencrypt/live/chuspace.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/chuspace.com/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/chuspace.com/chain.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  try_files $uri/index.html $uri @puma;


  location ~* /(packs|assets)/{
    gzip_static on;
    expires max;
    add_header Cache-Control public;
  }

  location @puma {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_redirect off;

    proxy_pass http://puma;
  }

  location ^~ /.well-known/ {
    root /usr/share/nginx/html;
  }

  error_page 500 502 503 504 /500.html;
  client_max_body_size 10M;
  keepalive_timeout 10;
}

server {
  server_name images.chuspace.com;
  listen [::]:443 ssl http2;
  listen 443 ssl http2;
  gzip off;

  location @imgproxy {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_pass http://imgproxy;
  }

  client_max_body_size 25M;
  keepalive_timeout 10;
}

server {
  server_name websocket.chuspace.com;
  listen [::]:443 ssl http2;
  listen 443 ssl http2;
  gzip off;

  location @anycable {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_pass http://anycable;
  }

  client_max_body_size 5M;
  keepalive_timeout 10;
}
