service GitServer {
  rpc InitBareRepo(User) returns (Repo) {}
  rpc CreateEphemeralBranch(Repo) returns (Branch) {}
  rpc Diff(File) returns (Diff) {}
  rpc DiffBranch(Branch) returns (BranchDiff) {}
  rpc Commit(File) returns (Branch) {}
  rpc MergeEphemeralBranch(Branch) returns (Repo) {}
}

message User {}
message Repo {}
message Branch {}
message File {}
message Diff {}
message BranchDiff {}
