version: 2
jobs:
  build:
    working_directory: ~/chuspace
    docker:
      - image: circleci/ruby:2.6.4-node-browsers
        environment:
          PGHOST: localhost
          PGUSER: postgres
          RAILS_ENV: test
      - image: postgres:11.2-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: chuspace_test
          POSTGRES_PASSWORD: ''
      - image: redis:5.0.4-alpine

    steps:
      - checkout

      - run:
          name: Installing GCC
          command: 'sudo apt-get update && sudo apt-get install gcc g++ cmake'

      - run:
          name: Installing vips
          command: sudo apt install libvips libvips-dev

      - restore_cache:
          keys:
            - v2-node-dependencies-{{ checksum "package.json" }}
            - v2-node-dependencies-

      - run: yarn install

      - save_cache:
          paths:
            - node_modules
            - node_modules/.cache/**/*
          key: v2-node-dependencies-{{ checksum "package.json" }}

      - restore_cache:
          keys:
            - v2-rails-dependencies-{{ checksum "Gemfile.lock" }}
            - v2-rails-dependencies-

      - run:
          name: install dependencies
          command: |
            bundle install --jobs=4 --retry=3 --path vendor/bundle

      - run:
          name: Compiling assets...
          command: CI=yes bundle exec rails assets:precompile

      - save_cache:
          paths:
            - ./vendor/bundle
            - ./tmp/cache/webpacker/*
            - ./public/packs-test/**/*
            - ./public/assets/**/*
          key: v2-rails-dependencies-{{ checksum "Gemfile.lock" }}

      - run:
          name: Setting databases...
          command: bundle exec rake db:create && bundle exec rake db:schema:load

      - run:
          name: Setup configs...
          command: |
            cp config/git.yml.example config/git.yml &&
            cp openssh/sshd_config.example openssh/sshd_config &&
            ssh-keygen -t rsa -b 4096 -C "gaurav@gauravtiwari.co.uk" -f ./openssh/ssh_host_rsa_key -q -N ""

      - run:
          name: Run linters
          command: bin/rubocop && brakeman -q -w2 && bundle audit --update

      - run:
          name: run tests
          command: |
            mkdir /tmp/test-results
            TEST_FILES="$(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)"

            bundle exec rspec --format progress \
                            --format RspecJunitFormatter \
                            --out /tmp/test-results/rspec.xml \
                            --format progress \
                            $TEST_FILES

      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results
