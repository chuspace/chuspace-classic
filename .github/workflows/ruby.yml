name: Chuspace
on: [push, pull_request]

jobs:
  verify:
    name: Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: chuspace_test
          POSTGRES_PASSWORD: ''
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    container:
      image: circleci/ruby:2.6.4-node-browsers

    steps:
      - uses: actions/checkout@v1
      - name: Install dependencies
        run: |
          npm -g install chromedriver
          gem install bundler
          bundle install
          yarn install

      - name: Setup test database
        env:
          RAILS_ENV: test
          PGHOST: localhost
          PGUSER: postgres
        run: |
          bin/rails db:create
          bin/rails db:migrate
          bin/rails assets:precompile

      - name: Run Rubocop
        run: bin/rubocop
      - name: Run Bundler Audit
        run: bin/bundler-audit --update
      - name: Run Brakeman
        run: bin/brakeman -q -w2
      - name: Run tests
        run: bundle exec rails test
      - name: Run system tests
        run: bundle exec rails test:system
