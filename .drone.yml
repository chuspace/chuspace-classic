pipeline:
  restore-cache:
    image: drillster/drone-volume-cache
    restore: true
    mount:
      - ./vendor/bundle
      - ./node_modules
    volumes:
      - /tmp/cache:/cache

  bundle-install:
    image: gcr.io/chuspace-210609/ci:latest
    group: deps
    environment:
      - BUNDLE_PATH=./vendor/bundle
      - BUNDLE_DISABLE_SHARED_GEMS=true
    commands:
      - bundle check || bundle install --jobs 3 --retry 3 --without development,production

  yarn-install:
    image: gcr.io/chuspace-210609/ci:latest
    group: deps
    commands:
      - yarn install

  rebuild-cache:
    image: drillster/drone-volume-cache
    rebuild: true
    mount:
      - ./vendor/bundle
      - ./node_modules
    volumes:
      - /tmp/cache:/cache

  test:
    image: gcr.io/chuspace-210609/ci:latest
    environment:
      - BUNDLE_PATH=./vendor/bundle
      - DATABASE_URL=postgres://postgres:password@postgres:5432/chuspace_test
      - REDIS_URL=redis://redis:6379
      - DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL=true
    commands:
      - bin/rspec
      - bundle exec rubocop

  push:
    image: plugins/gcr
    repo: chuspace-210609/chuspace-web
    tags: ${DRONE_COMMIT}
    secrets: [gcr_json_key]
    when:
      branch: master

  deploy-web:
    image: quay.io/honestbee/drone-kubernetes
    group: deploy
    kubernetes_server: ${KUBERNETES_SERVER}
    kubernetes_cert: ${KUBERNETES_CERT}
    kubernetes_token: ${KUBERNETES_TOKEN}
    deployment: chuspace-web
    repo: gcr.io/chuspace-210609/chuspace-web
    container: chuspace-web
    tag:
      - ${DRONE_COMMIT}
      - latest
    secrets: [kubernetes_server, kubernetes_token, kubernetes_cert]
    when:
      branch: master

  deploy-worker:
    image: quay.io/honestbee/drone-kubernetes
    group: deploy
    kubernetes_server: ${KUBERNETES_SERVER}
    kubernetes_cert: ${KUBERNETES_CERT}
    kubernetes_token: ${KUBERNETES_TOKEN}
    deployment: chuspace-worker
    repo: gcr.io/chuspace-210609/chuspace-web
    container: chuspace-worker
    tag:
      - ${DRONE_COMMIT}
      - latest
    secrets: [kubernetes_server, kubernetes_token, kubernetes_cert]
    when:
      branch: master


services:
  postgres:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=chuspace_test
  redis:
    image: redis:alpine
